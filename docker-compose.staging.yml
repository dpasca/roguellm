name: roguellm-staging

services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ./.env.staging
    environment:
      APP_ENV: production
      DEFAULT_NEW_WORLD_VISIBILITY: private
      REQUIRE_LOGIN_TO_CREATE_WORLD: "1"
      ENABLE_WORLD_LIBRARY: "0"
      ENABLE_DEBUG_SEED: "0"
    ports:
      - "127.0.0.1:${ROGUELLM_HOST_PORT:-18080}:8000"
    volumes:
      - roguellm-data:/app/_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  roguellm-data:
